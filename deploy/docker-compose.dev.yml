services:
  kluddra:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: kluddra-dev
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - KLUDDRA_PORT=8080
      - KLUDDRA_DATA_DIR=/data
      - KLUDDRA_TRUSTED_PROXIES=127.0.0.1/32
      - KLUDDRA_LOG_LEVEL=debug
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
