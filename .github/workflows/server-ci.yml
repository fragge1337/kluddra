name: Kluddra Server CI

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: server/go.sum

      - name: Tidy & verify dependencies
        run: go mod tidy && go vet ./...

      - name: Run unit, sync, conflict & API tests with race detector
        run: go test -v -race -count=1 ./...

      - name: Verify static cross-compilation (amd64 & arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/kluddra-amd64 ./cmd/kluddra
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/kluddra-arm64 ./cmd/kluddra
